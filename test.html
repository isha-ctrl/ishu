<!DOCTYPE html>
<html>
<head>
    <title>Flower Shower</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #fff0f5;
        }

        button {
            padding: 15px 30px;
            font-size: 20px;
            border: none;
            border-radius: 30px;
            background: #ff4f81;
            color: white;
            cursor: pointer;
        }

        .flower {
            position: fixed;
            top: -50px;
            font-size: 30px;
            pointer-events: none;
            animation: fall linear forwards;
        }

        @keyframes fall {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 1;
            }

            100% {
                transform: translateY(110vh) rotate(360deg);
                opacity: 0;
            }
        }
    </style>
</head>

<body>

    <button onclick="flowerShower()">
        Click Me 🌸
    </button>

    <script>
        function flowerShower() {

            const flowers = ["🌸", "🌺", "🌷", "🌹", "💐", "🌼"];

            for (let i = 0; i < 50; i++) {

                const flower = document.createElement("div");

                flower.classList.add("flower");

                flower.innerHTML =
                    flowers[Math.floor(Math.random() * flowers.length)];

                flower.style.left = Math.random() * 100 + "vw";

                flower.style.fontSize =
                    (20 + Math.random() * 30) + "px";

                flower.style.animationDuration =
                    (2 + Math.random() * 4) + "s";

                flower.style.animationDelay =
                    Math.random() * 1 + "s";

                document.body.appendChild(flower);

                setTimeout(() => {
                    flower.remove();
                }, 6000);
            }
        }
    </script>

</body>
</html>
